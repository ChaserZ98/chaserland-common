[project]
name = "chaserland-common"
version = "0.1.0"
description = ""
authors = [{ name = "ChaserZ98", email = "feiyuzheng98@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12, <4"
dependencies = [
    "grpcio (>=1.71.0,<2.0.0)",
    "pycryptodome (>=3.22.0,<4.0.0)",
    "grpc-interceptor (>=0.15.4,<0.16.0)",
]

[tool.poetry]
packages = [{ include = "chaserland_common", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-cov = "^6.0.0"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["--cov=chaserland_common", "--cov-report=term", "--cov-report=html"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
